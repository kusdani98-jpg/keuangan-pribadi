<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengatur Keuangan Pribadi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* Background Glowing Blobs Animation */
    @keyframes float-slow {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.1); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, 40px) scale(1.15); }
    }
    .animate-blob-1 { animation: float-slow 10s infinite ease-in-out; }
    .animate-blob-2 { animation: float-reverse 12s infinite ease-in-out; }

    /* Button Shimmer Effect */
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
    .animate-shimmer {
      animation: shimmer 2.5s infinite;
    }

    /* Table Row Slide In Staggered */
    @keyframes rowSlideIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-row {
      animation: rowSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8 relative overflow-x-hidden selection:bg-blue-500 selection:text-white">

  <!-- Background Animated Blobs -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] animate-blob-1"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] animate-blob-2"></div>
    <div class="absolute top-3/4 left-1/3 w-80 h-80 bg-emerald-600/15 rounded-full blur-[100px] animate-blob-1"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 transition-all duration-500 ease-out bg-slate-800 border border-slate-700 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-medium backdrop-blur-xl">
    <div id="toast-icon-bg" class="p-1.5 rounded-xl bg-emerald-500/20 text-emerald-400">
      <i data-lucide="check-circle" class="w-5 h-5"></i>
    </div>
    <span id="toast-message">Berhasil disimpan!</span>
  </div>

  <div class="max-w-5xl mx-auto space-y-8 relative z-10">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800/80 pb-6 gap-4">
      <div>
        <div class="flex items-center gap-3">
          <div class="p-3 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-2xl shadow-lg shadow-blue-500/20 hover:rotate-6 hover:scale-110 transition-all duration-300 cursor-pointer">
            <i data-lucide="wallet" class="w-7 h-7"></i>
          </div>
          <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
              Keuangan Pribadi
            </h1>
            <p class="text-slate-400 text-sm mt-0.5">Kelola arus kas dan catat transaksi harianmu</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2.5 text-xs font-semibold bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-full text-slate-300 self-start md:self-auto shadow-inner backdrop-blur-md">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        Database Terhubung
      </div>
    </header>

    <!-- Cards Ringkasan Saldo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <!-- Total Pemasukan -->
      <div class="bg-slate-900/70 backdrop-blur-xl p-6 rounded-2xl border border-slate-800/80 shadow-2xl relative overflow-hidden group hover:-translate-y-2 hover:border-emerald-500/40 hover:shadow-emerald-500/10 transition-all duration-500">
        <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl group-hover:bg-emerald-500/25 transition-all duration-500"></div>
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Pemasukan</span>
          <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl group-hover:rotate-12 group-hover:scale-110 transition-all duration-300">
            <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
          </div>
        </div>
        <p id="total-income" class="text-3xl font-black text-emerald-400 tracking-tight">Rp 0</p>
      </div>

      <!-- Total Pengeluaran -->
      <div class="bg-slate-900/70 backdrop-blur-xl p-6 rounded-2xl border border-slate-800/80 shadow-2xl relative overflow-hidden group hover:-translate-y-2 hover:border-rose-500/40 hover:shadow-rose-500/10 transition-all duration-500">
        <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-rose-500/10 rounded-full blur-2xl group-hover:bg-rose-500/25 transition-all duration-500"></div>
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Pengeluaran</span>
          <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl group-hover:-rotate-12 group-hover:scale-110 transition-all duration-300">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
          </div>
        </div>
        <p id="total-expense" class="text-3xl font-black text-rose-400 tracking-tight">Rp 0</p>
      </div>

      <!-- Sisa Saldo -->
      <div class="bg-slate-900/70 backdrop-blur-xl p-6 rounded-2xl border border-slate-800/80 shadow-2xl relative overflow-hidden group hover:-translate-y-2 hover:border-blue-500/40 hover:shadow-blue-500/10 transition-all duration-500">
        <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-500/25 transition-all duration-500"></div>
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sisa Saldo</span>
          <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-xl group-hover:scale-125 transition-all duration-300">
            <i data-lucide="scale" class="w-5 h-5"></i>
          </div>
        </div>
        <p id="total-balance" class="text-3xl font-black text-blue-400 tracking-tight">Rp 0</p>
      </div>
    </div>

    <!-- Form Tambah Transaksi -->
    <div class="bg-slate-900/70 backdrop-blur-xl p-6 md:p-8 rounded-2xl border border-slate-800/80 shadow-2xl transition-all hover:border-slate-700">
      <div class="flex items-center gap-2.5 mb-6">
        <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
        </div>
        <h2 class="text-lg font-bold text-white">Tambah Transaksi Baru</h2>
      </div>

      <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Keterangan Transaksi</label>
          <div class="relative group">
            <i data-lucide="file-text" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500 group-focus-within:text-blue-400 group-focus-within:scale-110 transition-all"></i>
            <input type="text" id="title" required placeholder="Contoh: Nasi Goreng, Bensin, Gaji" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Jumlah (Rp)</label>
          <div class="relative group">
            <span class="absolute left-3.5 top-2.5 text-sm font-bold text-slate-500 group-focus-within:text-blue-400 transition-colors">Rp</span>
            <input type="number" id="amount" required placeholder="50000" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Jenis Transaksi</label>
          <div class="relative group">
            <i data-lucide="arrow-left-right" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
            <select id="type" onchange="autoSelectCategory()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all appearance-none cursor-pointer">
              <option value="expense">Pengeluaran</option>
              <option value="income">Pemasukan</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Kategori</label>
          <div class="relative group">
            <i data-lucide="tag" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
            <select id="category" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all appearance-none cursor-pointer">
              <option value="Makanan & Minuman">Makanan & Minuman</option>
              <option value="Transportasi">Transportasi</option>
              <option value="Belanja">Belanja</option>
              <option value="Tagihan & Utilitas">Tagihan & Utilitas</option>
              <option value="Hiburan">Hiburan</option>
              <option value="Kesehatan">Kesehatan</option>
              <option value="Gaji & Pendapatan">Gaji & Pendapatan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
        </div>

        <!-- Tombol Simpan Beranimasi Shimmer -->
        <div class="md:col-span-2 pt-2">
          <button type="submit" class="relative w-full overflow-hidden bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2 text-sm group">
            <div class="absolute inset-0 w-1/2 h-full bg-white/20 -skew-x-12 -translate-x-full animate-shimmer"></div>
            <i data-lucide="save" class="w-4 h-4 group-hover:scale-125 group-hover:rotate-12 transition-transform duration-300"></i>
            Simpan Transaksi
          </button>
        </div>
      </form>
    </div>

    <!-- Tabel Riwayat Transaksi -->
    <div class="bg-slate-900/70 backdrop-blur-xl rounded-2xl border border-slate-800/80 shadow-2xl overflow-hidden">
      <div class="p-6 border-b border-slate-800/80 flex justify-between items-center">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg">
            <i data-lucide="history" class="w-5 h-5"></i>
          </div>
          <h2 class="text-lg font-bold text-white">Riwayat Transaksi</h2>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-950/80 text-slate-400 font-semibold uppercase text-[11px] tracking-wider border-b border-slate-800/80">
            <tr>
              <th class="p-4 pl-6">Waktu Transaksi</th>
              <th class="p-4">Keterangan</th>
              <th class="p-4">Kategori</th>
              <th class="p-4 text-right">Jumlah</th>
              <th class="p-4 text-center pr-6">Aksi</th>
            </tr>
          </thead>
          <tbody id="transaction-list" class="divide-y divide-slate-800/50 text-slate-300">
            <!-- Data dari Supabase akan dirender di sini -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Config Supabase
    const SUPABASE_URL = "https://vvhrununvrxdbmkrwkwe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_OVISexhBVxrfVIEil0cshw_2A5MgfFP";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Format angka ke Rupiah
    const formatRupiah = (number) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    };

    // Format tanggal dan jam (WIB)
    const formatDateTime = (isoString) => {
      if (!isoString) return '-';
      const date = new Date(isoString);
      return new Intl.DateTimeFormat('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date) + ' WIB';
    };

    // Animated Count-Up Number Effect
    function animateValue(elementId, start, end, duration) {
      const obj = document.getElementById(elementId);
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const currentVal = Math.floor(progress * (end - start) + start);
        obj.innerText = formatRupiah(currentVal);
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };
      window.requestAnimationFrame(step);
    }

    // Confetti Explosion Effect
    function triggerConfetti() {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#10B981', '#3B82F6', '#F59E0B']
      });
    }

    // Toast Notification Modern
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIconBg = document.getElementById('toast-icon-bg');
      
      toastMessage.innerText = message;
      if (isError) {
        toastIconBg.className = 'p-1.5 rounded-xl bg-rose-500/20 text-rose-400';
      } else {
        toastIconBg.className = 'p-1.5 rounded-xl bg-emerald-500/20 text-emerald-400';
      }
      
      toast.classList.remove('translate-x-full', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
      }, 3500);
    }

    // Auto-select kategori saat jenis transaksi berubah
    function autoSelectCategory() {
      const type = document.getElementById('type').value;
      const categorySelect = document.getElementById('category');
      if (type === 'income') {
        categorySelect.value = 'Gaji & Pendapatan';
      } else {
        categorySelect.value = 'Makanan & Minuman';
      }
    }

    // Ambil & Tampilkan Data Transaksi
    async function fetchTransactions() {
      const { data, error } = await supabaseClient
        .from('transactions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Gagal mengambil data:', error.message);
        return;
      }

      let totalIncome = 0;
      let totalExpense = 0;
      const listContainer = document.getElementById('transaction-list');
      listContainer.innerHTML = '';

      if (data.length === 0) {
        listContainer.innerHTML = `
          <tr>
            <td colspan="5" class="p-8 text-center text-slate-500">
              Belum ada transaksi. Tambahkan transaksi pertamamu di atas!
            </td>
          </tr>
        `;
      } else {
        data.forEach((item, index) => {
          if (item.type === 'income') totalIncome += Number(item.amount);
          if (item.type === 'expense') totalExpense += Number(item.amount);

          const isIncome = item.type === 'income';
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-800/40 transition-all duration-200 group animate-row';
          row.style.animationDelay = `${index * 60}ms`; // Staggered Animation
          
          const formattedDate = formatDateTime(item.created_at || item.date);

          row.innerHTML = `
            <td class="p-4 pl-6 text-slate-400 font-medium whitespace-nowrap">${formattedDate}</td>
            <td class="p-4 font-semibold text-slate-100 group-hover:text-blue-400 transition-colors">${item.title}</td>
            <td class="p-4">
              <span class="bg-slate-800/80 border border-slate-700/60 text-slate-300 px-3 py-1 rounded-full text-xs font-medium group-hover:border-slate-500 transition-all">
                ${item.category}
              </span>
            </td>
            <td class="p-4 text-right font-bold whitespace-nowrap ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
              ${isIncome ? '+' : '-'} ${formatRupiah(item.amount)}
            </td>
            <td class="p-4 text-center pr-6">
              <button onclick="deleteTransaction('${item.id}')" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-all active:scale-90" title="Hapus Transaksi">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          `;
          listContainer.appendChild(row);
        });
      }

      // Jalankan Animasi Angka Berjalan
      animateValue('total-income', 0, totalIncome, 800);
      animateValue('total-expense', 0, totalExpense, 800);
      animateValue('total-balance', 0, totalIncome - totalExpense, 800);

      // Re-initialize Lucide Icons
      lucide.createIcons();
    }

    // Tambah Transaksi Baru
    document.getElementById('transaction-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;

      const { error } = await supabaseClient
        .from('transactions')
        .insert([{ title, amount, type, category }]);

      if (error) {
        showToast('Gagal menyimpan: ' + error.message, true);
      } else {
        document.getElementById('transaction-form').reset();
        showToast('Transaksi berhasil disimpan!');
        
        // Semburkan konfeti jika transaksi berupa Pemasukan!
        if (type === 'income') {
          triggerConfetti();
        }
        
        fetchTransactions(); // Refresh tabel & jalankan animasi
      }
    });

    // Hapus Transaksi
    async function deleteTransaction(id) {
      if (confirm('Apakah kamu yakin ingin menghapus transaksi ini?')) {
        const { error } = await supabaseClient
          .from('transactions')
          .delete()
          .eq('id', id);

        if (error) {
          showToast('Gagal menghapus: ' + error.message, true);
        } else {
          showToast('Transaksi berhasil dihapus');
          fetchTransactions();
        }
      }
    }

    // Jalankan pertama kali saat halaman dibuka
    fetchTransactions();
  </script>
</body>
</html>
